  <rect x="540" y="248" width="236" height="228" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
  <rect x="552" y="258" width="212" height="120" rx="8" fill="#f4f4f5" />
  <circle cx="658" cy="318" r="30" fill="#e4e4e7" />
  <text x="658" y="324" fill="#18181b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SC-03</text>
  
  <text x="552" y="398" fill="#71717a" font-family="monospace" font-size="10">HEADWEAR / CAPS</text>
  <text x="552" y="416" fill="#18181b" font-family="sans-serif" font-size="13" font-weight="bold">Embroidered Vintage Cap</text>
  <text x="552" y="445" fill="#059669" font-family="sans-serif" font-size="14" font-weight="bold">₱550.00</text>
  <rect x="686" y="430" width="78" height="26" rx="6" fill="#18181b" />
  <text x="725" y="447" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">View Item</text>
