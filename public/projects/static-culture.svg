  <text x="400" y="324" fill="#18181b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SC-02</text>
  
  <text x="294" y="398" fill="#71717a" font-family="monospace" font-size="10">OVERSIZED HOODIE</text>
