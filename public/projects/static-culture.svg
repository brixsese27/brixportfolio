  <!-- Product Showcase Grid (3 Items) -->
  <!-- Product 1 -->
  <rect x="24" y="248" width="236" height="228" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
  <rect x="36" y="258" width="212" height="120" rx="8" fill="#f4f4f5" />
  <circle cx="142" cy="318" r="30" fill="#e4e4e7" />
