  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <text x="80" y="25" fill="#71717a" font-family="monospace" font-size="12">static-culture.store / collection-2026</text>
  <rect x="670" y="10" width="110" height="22" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1" />
  <text x="725" y="25" fill="#059669" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Live Storefront</text>

  <!-- Brand Navbar -->
  <rect x="24" y="60" width="752" height="48" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
