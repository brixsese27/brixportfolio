<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="500" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Top App Window Bar -->
  <rect width="800" height="42" fill="#0b1120" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <text x="80" y="25" fill="#64748b" font-family="monospace" font-size="12" font-weight="600">asset-management-system.local / dashboard</text>
  <rect x="680" y="12" width="100" height="18" rx="4" fill="#1e293b" />
  <text x="730" y="24" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">RBAC: Admin</text>

  <!-- Sidebar -->
  <rect x="0" y="42" width="180" height="458" fill="#090d16" />
  <line x1="180" y1="42" x2="180" y2="500" stroke="#1e293b" stroke-width="1" />
  
  <rect x="16" y="60" width="148" height="32" rx="6" fill="#1e293b" />
  <text x="32" y="80" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">◈ Asset Hub</text>

  <text x="24" y="120" fill="#64748b" font-family="monospace" font-size="10">NAVIGATION</text>
  <rect x="16" y="130" width="148" height="28" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="30" y="148" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">▪ Hardware Inventory</text>
  <text x="30" y="180" fill="#94a3b8" font-family="sans-serif" font-size="11">▪ Allocations & Logs</text>
  <text x="30" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">▪ Depreciation Audit</text>
  <text x="30" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11">▪ Maintenance Queue</text>
  <text x="30" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">▪ QR / Barcode Hub</text>

  <!-- Main Content Header -->
  <text x="204" y="76" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Hardware & Equipment Inventory</text>
  <text x="204" y="96" fill="#64748b" font-family="sans-serif" font-size="12">1,248 Total Registered Items • 18 Pending Maintenance</text>

  <!-- Metric Cards -->
  <rect x="204" y="112" width="180" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="220" y="134" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Active Hardware</text>
  <text x="220" y="162" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">1,184 <tspan fill="#10b981" font-size="11" font-weight="normal">94.8% Active</tspan></text>

  <rect x="396" y="112" width="180" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="412" y="134" fill="#94a3b8" font-family="sans-serif" font-size="11">Asset Book Value</text>
  <text x="412" y="162" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">$482.5K <tspan fill="#06b6d4" font-size="11" font-weight="normal">Audited</tspan></text>

  <rect x="588" y="112" width="192" height="74" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="604" y="134" fill="#94a3b8" font-family="sans-serif" font-size="11">QR Sync Status</text>
  <text x="604" y="162" fill="#10b981" font-family="sans-serif" font-size="22" font-weight="bold">100% <tspan fill="#64748b" font-size="11" font-weight="normal">Normalized</tspan></text>

  <!-- Data Table View -->
  <rect x="204" y="200" width="576" height="280" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  
  <!-- Table Header -->
  <rect x="204" y="200" width="576" height="36" rx="8" fill="#1e293b" />
  <text x="220" y="222" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">TAG ID</text>
  <text x="310" y="222" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">EQUIPMENT MODEL</text>
  <text x="490" y="222" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">ASSIGNED TO</text>
  <text x="610" y="222" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">STATUS</text>
  <text x="710" y="222" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">ACTION</text>

  <!-- Row 1 -->
  <line x1="204" y1="276" x2="780" y2="276" stroke="#1e293b" stroke-width="1" />
  <text x="220" y="258" fill="#38bdf8" font-family="monospace" font-size="11">AST-9821</text>
  <text x="310" y="258" fill="#f8fafc" font-family="sans-serif" font-size="12">Dell Precision 5820 Workstation</text>
  <text x="490" y="258" fill="#94a3b8" font-family="sans-serif" font-size="12">Eng. Department</text>
  <rect x="610" y="244" width="70" height="20" rx="10" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
  <text x="645" y="258" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Operational</text>
  <rect x="710" y="246" width="50" height="18" rx="4" fill="#334155" />
  <text x="735" y="258" fill="#f8fafc" font-family="sans-serif" font-size="9" text-anchor="middle">View Log</text>

  <!-- Row 2 -->
  <line x1="204" y1="324" x2="780" y2="324" stroke="#1e293b" stroke-width="1" />
  <text x="220" y="306" fill="#38bdf8" font-family="monospace" font-size="11">AST-9822</text>
  <text x="310" y="306" fill="#f8fafc" font-family="sans-serif" font-size="12">Cisco Catalyst 3850 Switch 48P</text>
  <text x="490" y="306" fill="#94a3b8" font-family="sans-serif" font-size="12">Server Room B</text>
  <rect x="610" y="292" width="70" height="20" rx="10" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
  <text x="645" y="306" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Operational</text>
  <rect x="710" y="294" width="50" height="18" rx="4" fill="#334155" />
  <text x="735" y="306" fill="#f8fafc" font-family="sans-serif" font-size="9" text-anchor="middle">View Log</text>

  <!-- Row 3 -->
  <line x1="204" y1="372" x2="780" y2="372" stroke="#1e293b" stroke-width="1" />
  <text x="220" y="354" fill="#38bdf8" font-family="monospace" font-size="11">AST-9823</text>
  <text x="310" y="354" fill="#f8fafc" font-family="sans-serif" font-size="12">MacBook Pro 16" M2 Pro 32GB</text>
  <text x="490" y="354" fill="#94a3b8" font-family="sans-serif" font-size="12">UI/UX Studio</text>
  <rect x="610" y="340" width="70" height="20" rx="10" fill="#92400e" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
  <text x="645" y="354" fill="#fbbf24" font-family="sans-serif" font-size="10" text-anchor="middle">Maintenance</text>
  <rect x="710" y="342" width="50" height="18" rx="4" fill="#334155" />
  <text x="735" y="354" fill="#f8fafc" font-family="sans-serif" font-size="9" text-anchor="middle">View Log</text>

  <!-- Row 4 -->
  <text x="220" y="402" fill="#38bdf8" font-family="monospace" font-size="11">AST-9824</text>
  <text x="310" y="402" fill="#f8fafc" font-family="sans-serif" font-size="12">Synology RS2423+ NAS Storage</text>
  <text x="490" y="402" fill="#94a3b8" font-family="sans-serif" font-size="12">Data Center 1</text>
  <rect x="610" y="388" width="70" height="20" rx="10" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
  <text x="645" y="402" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Operational</text>
  <rect x="710" y="390" width="50" height="18" rx="4" fill="#334155" />
  <text x="735" y="402" fill="#f8fafc" font-family="sans-serif" font-size="9" text-anchor="middle">View Log</text>

  <!-- Footer Pagination in Table -->
  <line x1="204" y1="432" x2="780" y2="432" stroke="#1e293b" stroke-width="1" />
  <text x="220" y="456" fill="#64748b" font-family="monospace" font-size="10">Showing 1-4 of 1,248 assets</text>
  <text x="740" y="456" fill="#10b981" font-family="monospace" font-size="10" font-weight="600">Page 1 of 312 ›</text>
</svg>
