  <rect x="540" y="345" width="200" height="38" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="640" y="369" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">STATUS: READY TO SCAN</text>

  <text x="640" y="415" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Point attendee QR code at lens</text>
